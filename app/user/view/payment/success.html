<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 
                         'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;

            display: flex;
            align-items: center;

        .success-container {

<body>
    <div class="success-container">
        <div class="success-icon"></div>
        <h1>支付成功！</h1>
        <p class="message">您的订单已支付成功，感谢您的购买</p>
        
        <?php if (!empty($order)): ?>
        <div class="order-info">
            <div class="info-item">
                <span class="info-label">订单号</span>
                <span class="info-value">
                    <?php echo htmlspecialchars($order['order_no'] ?? '', ENT_QUOTES, 'UTF-8'); ?>
                </span>
            </div>
            <div class="info-item">
                <span class="info-label">商品名称</span>
                <span class="info-value">
                    <?php echo htmlspecialchars($order['product_name'] ?? '', ENT_QUOTES, 'UTF-8'); ?>
                </span>
            </div>
            <div class="info-item">
                <span class="info-label">支付金额</span>
                <span class="info-value amount">
                    ¥<?php echo htmlspecialchars(number_format($order['total_amount'] ?? 0, 2, '.', ''), ENT_QUOTES, 'UTF-8'); ?>
                </span>
            </div>
            <div class="info-item">
                <span class="info-label">支付时间</span>
                <span class="info-value">
                    <?php
                    $payTime = $order['pay_time'] ?? '';
                    echo htmlspecialchars($payTime !== '' ? $payTime : '刚刚', ENT_QUOTES, 'UTF-8');
                    ?>
                </span>
            </div>
            <div class="info-item">
                <span class="info-label">支付方式</span>
                <span class="info-value">
                    <?php
                    $methodName = $order['payment_method_name'] ?? '';
                    echo htmlspecialchars($methodName !== '' ? $methodName : '余额支付', ENT_QUOTES, 'UTF-8');
                    ?>
                </span>
            </div>
        </div>
        <?php endif; ?>
        
        <div class="actions">
            <a href="javascript:void(0);" onclick="goToProductPage()" class="btn btn-primary">返回下单页面</a>
            <a href="javascript:void(0);" onclick="goToOrdersPage()" class="btn btn-secondary">查看订单</a>
        </div>
        
        <div class="countdown" id="countdown">3秒后自动返回下单页面</div>
    </div>
    
    <script>
        let countdown = 3;
        const countdownEl = document.getElementById('countdown');
        
        // 商品代码 - 从PHP传递
        <?php
        $productCode = !empty($order['product_code']) ? htmlspecialchars($order['product_code'], ENT_QUOTES, 'UTF-8') : 'gjlw';
        echo "const productCode = '{$productCode}';";
        ?>
        
        // 获取商品代码，用于跳转到对应的商品页面
        function getProductCode() {
            return productCode;
        }
        
        // 安全跳转函数，处理iframe情况
        function safeRedirect(url) {
            // 检测是否在iframe中
            function isInIframe() {
                try {
                    return window.self !== window.top;
                } catch (e) {
                    // 跨域情况下无法访问window.top，假设在iframe中
                    return true;
                }
            }
            
            if (isInIframe()) {
                // 在iframe中，跳转到顶层窗口
                try {
                    window.top.location.href = url;
                } catch (e) {
                    // 如果跨域限制，尝试在当前窗口跳转
                    try {
                        window.location.href = url;
                    } catch (e2) {
                        console.error('无法跳转:', e2);
                    }
                }
            } else {
                // 不在iframe中，直接跳转
                window.location.href = url;
            }
        }
        
        // 获取商品页跳转URL
        function getRedirectUrl() {
            const productCode = getProductCode();
            // 跳转到对应的商品页面
            return '/user/product?code=' + encodeURIComponent(productCode);
        }
        
        // 跳转到商品页面的函数
        function goToProductPage() {
            const redirectUrl = getRedirectUrl();
            safeRedirect(redirectUrl);
        }

        // 我的订单列表页（对应 app/user/view/user/orders.html）
        function getOrdersUrl() {
            return '/user/orders';
        }

        // 跳转到订单列表对应栏目
        function goToOrdersPage() {
            const ordersUrl = getOrdersUrl();
            safeRedirect(ordersUrl);
        }
        
        const timer = setInterval(function() {
            countdown--;
            if (countdown > 0) {
                countdownEl.textContent = countdown + '秒后自动返回下单页面';
            } else {
                clearInterval(timer);
                goToProductPage();
            }
        }, 1000);
    </script>
</body>
</html>
