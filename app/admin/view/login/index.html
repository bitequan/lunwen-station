<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 对接端管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 
                         'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            font-size: 14px;
            color: #8c8c8c;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #262626;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1);
        }
        
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        
        .form-checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .form-checkbox label {
            font-size: 14px;
            color: #595959;
            cursor: pointer;
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1890ff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-login:hover {
            background: #40a9ff;
        }
        
        .btn-login:active {
            background: #096dd9;
        }
        
        .btn-login:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #8c8c8c;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">⚡</div>
            <h1 class="login-title">对接端管理系统</h1>
            <p class="login-subtitle">管理员登录</p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-input" placeholder="请输入用户名" autocomplete="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-input" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            
            <div class="form-checkbox">
                <input type="checkbox" name="remember" id="remember" value="1">
                <label for="remember">记住我</label>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">登录</button>
        </form>
        
        <div class="login-footer">
            TokenAPI 对接端管理系统
        </div>
    </div>
    
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const ADMIN_REMEMBER_CREDENTIALS_KEY = 'admin_remember_credentials';

        function saveRememberedLogin(username, password, remember) {
            if (!remember) {
                localStorage.removeItem(ADMIN_REMEMBER_CREDENTIALS_KEY);
                return;
            }
            localStorage.setItem(ADMIN_REMEMBER_CREDENTIALS_KEY, JSON.stringify({
                username: username || '',
                password: password || ''
            }));
        }

        function applyRememberedLogin() {
            const usernameInput = loginForm.querySelector('input[name="username"]');
            const passwordInput = loginForm.querySelector('input[name="password"]');
            const rememberInput = document.getElementById('remember');
            if (!usernameInput || !passwordInput || !rememberInput) {
                return;
            }
            const raw = localStorage.getItem(ADMIN_REMEMBER_CREDENTIALS_KEY);
            if (!raw) {
                rememberInput.checked = false;
                return;
            }
            try {
                const data = JSON.parse(raw);
                usernameInput.value = data.username || '';
                passwordInput.value = data.password || '';
                rememberInput.checked = !!(data.username || data.password);
            } catch (e) {
                localStorage.removeItem(ADMIN_REMEMBER_CREDENTIALS_KEY);
                rememberInput.checked = false;
            }
        }

        applyRememberedLogin();
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }
        
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            data.remember = document.getElementById('remember').checked ? '1' : '0';
            
            // 禁用按钮
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            
            try {
                const response = await fetch('/admin/login/doLogin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.code == 1) {
                    saveRememberedLogin(data.username, data.password, data.remember === '1');
                    // 登录成功，跳转
                    window.location.href = result.url || '/admin/';
                } else {
                    // 显示错误
                    showError(result.msg || '登录失败');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });
    </script>
</body>
</html>
