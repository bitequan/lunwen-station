<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><?php echo isset($user) && $user ? '编辑用户' : '新增用户'; ?></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 
                         'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            padding: 40px;
            color: #262626;
        }
        
        .page-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .page-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #1890ff;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #262626;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #262626;
        }
        
        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #1890ff;
        }
        
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #1890ff;
            color: #ffffff;
        }
        
        .btn-primary:hover {
            background: #40a9ff;
        }
        
        .form-actions {
            text-align: right;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e8e8e8;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title"><?php echo isset($user) && $user ? '编辑用户' : '新增用户'; ?></h1>
        </div>
        
        <form id="userForm">
            <input type="hidden" name="id" value="<?php echo isset($user['id']) ? $user['id'] : ''; ?>">
            
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" name="username" value="<?php echo isset($user['username']) ? htmlspecialchars($user['username']) : ''; ?>" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-input" <?php echo isset($user) && $user ? 'placeholder="不修改请留空"' : 'required'; ?>>
            </div>
            
            <div class="form-group">
                <label class="form-label">昵称</label>
                <input type="text" name="nickname" value="<?php echo isset($user['nickname']) ? htmlspecialchars($user['nickname']) : ''; ?>" class="form-input">
            </div>
            
            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" name="email" value="<?php echo isset($user['email']) ? htmlspecialchars($user['email']) : ''; ?>" class="form-input">
            </div>
            
            <div class="form-group">
                <label class="form-label">手机号</label>
                <input type="text" name="phone" value="<?php echo isset($user['phone']) ? htmlspecialchars($user['phone']) : ''; ?>" class="form-input">
            </div>
            
            <div class="form-group">
                <label class="form-label">状态</label>
                <select name="status" class="form-input">
                    <option value="1" <?php echo (isset($user['status']) && $user['status'] == 1) ? 'selected' : ''; ?>>正常</option>
                    <option value="0" <?php echo (isset($user['status']) && $user['status'] == 0) ? 'selected' : ''; ?>>禁用</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn" onclick="window.close()">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            fetch('/admin/saveUser', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(data => {
                if (data.code == 1) {
                    alert('保存成功');
                    if (window.opener) {
                        window.opener.location.reload();
                        window.close();
                    } else {
                        location.href = '/admin/users';
                    }
                } else {
                    alert(data.msg);
                }
            });
        });
    </script>
</body>
</html>
