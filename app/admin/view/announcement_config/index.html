<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告设置管理 - 管理员后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 
                         'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
            color: #262626;
            line-height: 1.6;
        }
        
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .config-panel {
            background: #ffffff;
            border-radius: 4px;
            padding: 32px;
            animation: fadeInUp 0.3s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 28px;
            padding: 0;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .panel-title::before {
            content: '|';
            color: #1890ff;
            font-weight: 700;
            font-size: 20px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #262626;
        }
        
        .form-label::after {
            content: '';
            display: inline-block;
            width: 4px;
            height: 4px;
            background: #ff4d4f;
            border-radius: 50%;
            margin-left: 4px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafafa;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #1890ff;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.1);
        }
        
        .form-textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafafa;
            resize: vertical;
            font-family: inherit;
            line-height: 1.6;
        }
        
        .form-textarea:focus {
            outline: none;
            border-color: #1890ff;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.1);
        }
        
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .form-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .form-checkbox span {
            font-size: 14px;
            color: #262626;
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #f0f0f0;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }
        
        .btn-cancel {
            background: #f5f5f5;
            color: #595959;
        }
        
        .btn-cancel:hover {
            background: #e8e8e8;
            color: #262626;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transform: translateY(-1px);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary:disabled {
            background: #d9d9d9;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        .form-error {
            margin-top: 16px;
            padding: 12px 16px;
            background: #fff2f0;
            border-left: 4px solid #ff4d4f;
            border-radius: 6px;
            color: #ff4d4f;
            font-size: 14px;
            display: none;
            animation: shake 0.3s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .form-error.show {
            display: block;
        }
        
        .form-success {
            margin-top: 16px;
            padding: 12px 16px;
            background: #f6ffed;
            border-left: 4px solid #52c41a;
            border-radius: 6px;
            color: #52c41a;
            font-size: 14px;
            display: none;
        }
        
        .form-success.show {
            display: block;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1890ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-text {
            font-size: 13px;
            color: #8c8c8c;
            margin-top: 6px;
        }
        
        .time-info {
            display: flex;
            gap: 24px;
            margin-top: 16px;
            padding: 12px;
            background: #fafafa;
            border-radius: 6px;
            font-size: 13px;
            color: #595959;
        }
        
        .time-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .time-label {
            color: #8c8c8c;
        }
        
        .time-value {
            font-weight: 500;
            color: #262626;
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            
            .config-panel {
                padding: 20px;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .time-info {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="config-panel">
            <h2 class="panel-title">公告设置</h2>
            
            <form id="announcementForm">
                <div class="form-group">
                    <label class="form-label">公告标题</label>
                    <input type="text" id="title" class="form-input" placeholder="请输入公告标题" required>
                    <div class="info-text">公告标题将显示在用户中心等位置</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">公告内容</label>
                    <textarea id="content" class="form-textarea" placeholder="请输入公告内容" required></textarea>
                    <div class="info-text">支持HTML格式，建议使用简洁明了的语言</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">状态设置</label>
                    <label class="form-checkbox">
                        <input type="checkbox" id="status" checked>
                        <span>显示公告</span>
                    </label>
                    <div class="info-text">关闭后公告将不会显示给用户</div>
                </div>
                
                <div class="time-info" id="timeInfo" style="display: none;">
                    <div class="time-item">
                        <span class="time-label">更新时间</span>
                        <span class="time-value" id="updateTime">-</span>
                    </div>
                </div>
                
                <div class="form-error" id="formError"></div>
                <div class="form-success" id="formSuccess"></div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="resetForm()">重置</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">保存设置</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>
    
    <script>
        // 页面加载完成后获取公告数据
        document.addEventListener('DOMContentLoaded', function() {
            loadAnnouncement();
        });
        
        // 加载公告数据
        async function loadAnnouncement() {
            showLoading();
            
            try {
                const response = await fetch('/admin/announcementConfig/getAnnouncement');
                const result = await response.json();
                
                if (result.code === 1) {
                    const data = result.data;
                    
                    // 填充表单
                    document.getElementById('title').value = data.title || '';
                    document.getElementById('content').value = data.content || '';
                    document.getElementById('status').checked = data.status === 1;
                    
                    // 显示时间信息
                    if (data.update_time) {
                        document.getElementById('updateTime').textContent = data.update_time || '-';
                        document.getElementById('timeInfo').style.display = 'flex';
                    }
                } else {
                    showError('加载公告失败：' + result.msg);
                }
            } catch (error) {
                showError('网络错误，请检查连接');
                console.error('加载公告失败:', error);
            } finally {
                hideLoading();
            }
        }
        
        // 提交表单
        document.getElementById('announcementForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const status = document.getElementById('status').checked ? 1 : 0;
            
            // 验证表单
            if (!title) {
                showError('公告标题不能为空');
                return;
            }
            
            if (!content) {
                showError('公告内容不能为空');
                return;
            }
            
            // 提交数据
            await saveAnnouncement({ title, content, status });
        });
        
        // 保存公告
        async function saveAnnouncement(data) {
            showLoading();
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = '保存中...';
            
            try {
                const response = await fetch('/admin/announcementConfig/saveAnnouncement', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.code === 1) {
                    showSuccess('保存成功');
                    // 重新加载数据以更新时间信息
                    setTimeout(loadAnnouncement, 1000);
                } else {
                    showError('保存失败：' + result.msg);
                }
            } catch (error) {
                showError('网络错误，请检查连接');
                console.error('保存公告失败:', error);
            } finally {
                hideLoading();
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = '保存设置';
            }
        }
        
        // 重置表单
        function resetForm() {
            if (confirm('确定要重置表单吗？所有未保存的更改将会丢失。')) {
                loadAnnouncement();
            }
        }
        
        // 显示加载中
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        
        // 隐藏加载中
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('formError');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            // 隐藏成功信息
            document.getElementById('formSuccess').classList.remove('show');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 3000);
        }
        
        // 显示成功信息
        function showSuccess(message) {
            const successDiv = document.getElementById('formSuccess');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            
            // 隐藏错误信息
            document.getElementById('formError').classList.remove('show');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
