<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文模板管理</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 20px 20px 48px; box-sizing: border-box; min-height: 100vh; background: #f5f7fb; }
        .card { background: #fff; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.08); padding: 20px; max-width: 1160px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .title { margin: 0; font-size: 20px; color: #222; }
        .toolbar { display: flex; gap: 8px; align-items: center; }
        .input { border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; min-width: 220px; }
        .select { border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; min-width: 120px; }
        .btn { border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
        .btn-primary { background: #1677ff; color: #fff; }
        .btn-danger { background: #ff4d4f; color: #fff; }
        .btn-default { background: #f0f0f0; color: #333; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; text-align: left; }
        th { background: #fafafa; color: #555; font-weight: 600; }
        .cover-cell { text-align: center; }
        .cover-box {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            border: 1px solid #e7ecf5;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            box-shadow: 0 3px 10px rgba(15, 23, 42, .08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }
        .cover {
            width: 100%;
            height: 100%;
            border-radius: 7px;
            object-fit: contain;
            background: #fff;
            display: block;
        }
        .cover-empty {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            border: 1px dashed #d7deea;
            background: #f8fafc;
            color: #b0b9c8;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .actions { display: flex; gap: 8px; }
        .muted { color: #999; }
        .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; display: inline-block; }
        .tag-on { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .tag-off { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .name-col { width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pager {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            padding: 14px 18px;
            color: #475569;
            font-size: 13px;
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        }
        .pager > div:first-child {
            font-weight: 500;
            color: #334155;
            letter-spacing: 0.02em;
        }
        .pager-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .pager .btn {
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
            transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
        }
        .pager .btn:not(:disabled):active { transform: translateY(1px); }
        .pager .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
        .pager .select {
            min-width: 100px;
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #334155;
            font-size: 13px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }
        @media (max-width: 768px) {
            body { padding: 12px 12px 56px; background: #f3f6fc; }
            .card { padding: 14px; border-radius: 14px; }
            .header { flex-direction: column; align-items: stretch; gap: 10px; }
            .toolbar { flex-wrap: wrap; }
            .input { min-width: 0; width: 100%; box-sizing: border-box; }
            .toolbar .btn { flex: 1; min-width: 110px; }
            table, thead, tbody, th, td, tr { display: block; width: 100%; box-sizing: border-box; }
            thead { display: none; }
            table { border-collapse: separate; border-spacing: 0 10px; }
            tbody tr {
                margin-bottom: 10px;
                background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
                border: 1px solid #e8eef8;
                border-radius: 14px;
                box-shadow: 0 8px 22px rgba(15, 23, 42, .08);
                padding: 10px 12px;
            }
            tbody td {
                border: 0;
                padding: 7px 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                font-size: 14px;
            }
            tbody td::before {
                content: attr(data-label);
                color: #6b7280;
                font-size: 12px;
                flex: 0 0 74px;
                text-align: left;
            }
            tbody td.name-col {
                white-space: normal;
                overflow: visible;
                text-overflow: unset;
                width: 100%;
                align-items: flex-start;
            }
            .cover-cell {
                justify-content: space-between;
                align-items: center;
                text-align: left;
            }
            .cover-cell::before {
                flex: 0 0 74px;
                text-align: left;
            }
            .cover-cell .cover-box,
            .cover-cell .cover-empty {
                flex: 0 0 auto;
                margin-left: auto;
            }
            .cover-cell .cover-box,
            .cover-cell .cover-empty {
                width: 38px;
                height: 38px;
                border-radius: 8px;
            }
            .cover-cell .cover-box {
                padding: 3px;
            }
            .cover-cell .cover {
                border-radius: 6px;
            }
            .actions {
                width: 100%;
                flex-wrap: nowrap;
                justify-content: flex-end;
                gap: 6px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .actions .btn {
                flex: 0 0 auto;
                min-width: 66px;
                padding: 5px 9px;
                font-size: 12px;
                white-space: nowrap;
            }
            .pager {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                margin-top: 16px;
                padding: 14px 14px 16px;
                border-radius: 14px;
            }
            .pager-actions { justify-content: stretch; gap: 8px; flex-wrap: nowrap; }
            .pager .select { flex: 0 1 auto; min-width: 100px; max-width: 42%; }
            .pager .btn { flex: 1; min-width: 72px; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h2 class="title">论文模板管理</h2>
        <div class="toolbar">
            <input id="keyword" class="input" placeholder="按模板名称搜索">
            <button class="btn btn-primary" onclick="searchList()">查询</button>
            <button class="btn btn-primary" onclick="goCreateTemplate()">新增模板</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width: 80px;">封面</th>
                <th style="width: 100px;">ID</th>
                <th class="name-col">模板名称</th>
                <th style="width: 120px;">是否分享</th>
                <th style="width: 180px;">创建时间</th>
                <th style="width: 220px;">操作</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="6" class="muted" data-label="">加载中...</td></tr>
        </tbody>
    </table>
    <div class="pager">
        <div id="pagerInfo">第 1 / 1 页，共 0 条</div>
        <div class="pager-actions">
            <select id="pageSize" class="select" onchange="changePageSize()">
                <option value="10">10条/页</option>
                <option value="20">20条/页</option>
                <option value="30" selected>30条/页</option>
                <option value="50">50条/页</option>
            </select>
            <button id="prevBtn" class="btn btn-default" onclick="changePage(-1)">上一页</button>
            <button id="nextBtn" class="btn btn-default" onclick="changePage(1)">下一页</button>
        </div>
    </div>
</div>

<!-- 自定义确认弹窗 -->
<div id="confirmMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;"></div>
<div id="confirmDialog" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:10px;box-shadow:0 18px 45px rgba(15,23,42,.25);width:360px;max-width:90%;z-index:1000;">
    <div style="padding:18px 20px 8px;border-bottom:1px solid #f3f4f6;">
        <div id="confirmTitle" style="font-size:16px;font-weight:600;color:#111827;">操作确认</div>
    </div>
    <div style="padding:14px 20px 4px;font-size:14px;color:#4b5563;" id="confirmMessage">
        确定要删除该模板吗？
    </div>
    <div style="padding:10px 20px 16px;display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-default" onclick="hideConfirm()">取消</button>
        <button id="confirmOkBtn" class="btn btn-danger" onclick="confirmDelete()">确定</button>
    </div>
</div>

<script>
var pager = {
    page: 1,
    pageSize: 30,
    total: 0,
    totalPage: 1
};

var pendingAction = null;

function showConfirm(message, action) {
    pendingAction = action || null;
    var titleEl = document.getElementById('confirmTitle');
    var okBtn = document.getElementById('confirmOkBtn');
    var isDelete = !!(action && action.type === 'delete');
    titleEl.textContent = isDelete ? '删除确认' : '分享确认';
    okBtn.textContent = isDelete ? '确定删除' : '确定分享';
    okBtn.className = 'btn ' + (isDelete ? 'btn-danger' : 'btn-primary');
    document.getElementById('confirmMessage').textContent = message || '确定要删除吗？';
    document.getElementById('confirmMask').style.display = 'block';
    document.getElementById('confirmDialog').style.display = 'block';
}

function hideConfirm() {
    document.getElementById('confirmMask').style.display = 'none';
    document.getElementById('confirmDialog').style.display = 'none';
}

async function confirmDelete() {
    if (!pendingAction) {
        hideConfirm();
        return;
    }
    const action = pendingAction;
    pendingAction = null;
    hideConfirm();
    if (action.type === 'delete') {
        await doRemoveTemplate(action.tid);
        return;
    }
    if (action.type === 'share') {
        await updateShare(action.id, action.enableSubordinate, true);
    }
}

function esc(str) {
    return String(str || '').replace(/[&<>"']/g, function (m) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
    });
}
function fmtTime(v) {
    if (!v) return '-';
    if (typeof v === 'string' && v.indexOf('-') > -1) return v;
    var n = Number(v);
    if (!n) return String(v);
    var d = new Date(n * 1000);
    if (isNaN(d.getTime())) return String(v);
    var p = function (x) { return String(x).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function toInt(v, dft) {
    var n = Number(v);
    return Number.isFinite(n) && n > 0 ? Math.floor(n) : dft;
}

function applyPager(data, listLen) {
    var total = toInt(data && (data.total || data.count || data.total_count), 0);
    var page = toInt(data && (data.page || data.current_page), pager.page);
    var pageSize = toInt(data && (data.page_size || data.per_page), pager.pageSize);
    if (!total) {
        total = toInt(data && (data.total_page || data.last_page), 0) * pageSize;
    }
    if (!total) {
        total = listLen;
    }
    var totalPage = toInt(data && (data.total_page || data.last_page), Math.ceil(total / pageSize) || 1);
    pager.page = Math.min(page, totalPage);
    pager.pageSize = pageSize;
    pager.total = total;
    pager.totalPage = Math.max(1, totalPage);
}

function renderPager() {
    document.getElementById('pagerInfo').textContent = '第 ' + pager.page + ' / ' + pager.totalPage + ' 页，共 ' + pager.total + ' 条';
    document.getElementById('prevBtn').disabled = pager.page <= 1;
    document.getElementById('nextBtn').disabled = pager.page >= pager.totalPage;
    document.getElementById('pageSize').value = String(pager.pageSize);
}

function searchList() {
    pager.page = 1;
    loadList();
}

function changePage(step) {
    var next = pager.page + Number(step || 0);
    if (next < 1 || next > pager.totalPage) return;
    pager.page = next;
    loadList();
}

function changePageSize() {
    pager.pageSize = toInt(document.getElementById('pageSize').value, 30);
    pager.page = 1;
    loadList();
}

async function loadList() {
    const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="muted" data-label="">加载中...</td></tr>';
    const type = 'private';
    const kw = document.getElementById('keyword').value.trim();
    let url = '/admin/getPaperTemplates?type=' + encodeURIComponent(type) + '&agent_id_is_empty='
        + '&page=' + encodeURIComponent(String(pager.page))
        + '&page_size=' + encodeURIComponent(String(pager.pageSize));
    if (kw) {
        url += '&keyword=' + encodeURIComponent(kw);
    }
    try {
        const res = await fetch(url);
        const json = await res.json();
        const data = (json && json.code === 1 && json.data) ? json.data : {};
        const list = Array.isArray(data.list) ? data.list : (Array.isArray(data) ? data : []);
        applyPager(data, list.length);
        renderPager();
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="muted" data-label="">暂无数据</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(function (item) {
            const tid = Number(item.id || item.tid || 0);
            const cover = item.cover || item.avt || '';
            const isShare = Number(item.enable_subordinate || 0) === 1;
            const shareTag = isShare
                ? '<span class="tag tag-on">已分享</span>'
                : '<span class="tag tag-off">未分享</span>';
            const shareBtn = type === 'private'
                ? (isShare
                    ? '<button class="btn btn-default" onclick="updateShare(' + tid + ',0)">取消分享</button>'
                    : '<button class="btn btn-primary" onclick="updateShare(' + tid + ',1)">设为分享</button>')
                : '';
            const editBtn = '<button class="btn btn-default" onclick="goEditTemplate(' + tid + ')">编辑</button>';
            return '<tr>'
                + '<td class="cover-cell" data-label="封面">' + (cover
                    ? '<div class="cover-box"><img class="cover" src="' + esc(cover) + '" alt="模板封面"></div>'
                    : '<span class="cover-empty">暂无</span>') + '</td>'
                + '<td data-label="ID">' + tid + '</td>'
                + '<td class="name-col" data-label="模板名" title="' + esc(item.name || '-') + '">' + esc(item.name || '-') + '</td>'
                + '<td data-label="分享">' + shareTag + '</td>'
                + '<td data-label="创建时间">' + esc(fmtTime(item.create_time)) + '</td>'
                + '<td data-label="操作"><div class="actions">'
                + shareBtn
                + editBtn
                + '<button class="btn btn-danger" onclick="removeTemplate(' + tid + ')">删除</button>'
                + '</div></td>'
                + '</tr>';
        }).join('');
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted" data-label="">加载失败</td></tr>';
        renderPager();
    }
}

async function updateShare(id, enableSubordinate, skipConfirm) {
    if (!id) return;
    if (!skipConfirm && Number(enableSubordinate) === 1) {
        showConfirm('分享将向本系统用户共享此模板使用，确定继续吗？', {
            type: 'share',
            id: Number(id),
            enableSubordinate: Number(enableSubordinate)
        });
        return;
    }
    const res = await fetch('/admin/updatePaperTemplateShare', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: Number(id), enable_subordinate: Number(enableSubordinate) })
    });
    const json = await res.json();
    if (json && json.code === 1) {
        loadList();
        return;
    }
    alert(json && json.msg ? json.msg : '更新分享设置失败');
}

async function doRemoveTemplate(tid) {
    if (!tid) return;
    const res = await fetch('/admin/deletePaperTemplate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tid: Number(tid) })
    });
    const json = await res.json();
    if (json && json.code === 1) {
        loadList();
        return;
    }
    alert(json && json.msg ? json.msg : '删除失败');
}

function removeTemplate(tid) {
    if (!tid) return;
    showConfirm('删除后不可恢复，确定要删除该模板吗？', {
        type: 'delete',
        tid: Number(tid)
    });
}

function goEditTemplate(tid) {
    if (!tid) return;
    window.location.href = '/admin/autodoc/edit?tid=' + encodeURIComponent(String(tid));
}

function goCreateTemplate() {
    window.location.href = '/admin/autodoc/create';
}

document.addEventListener('DOMContentLoaded', loadList);
</script>
</body>
</html>
